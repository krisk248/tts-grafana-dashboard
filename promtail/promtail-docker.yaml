server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep containers matching our apps (more permissive regex)
      - source_labels: ['__meta_docker_container_name']
        regex: '.*(open-ai|prompt-faq).*'
        action: keep

      # Extract container name (remove leading slash)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # Extract image name
      - source_labels: ['__meta_docker_container_image']
        target_label: image

      # Extract stack/compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: stack

      # Add static labels for AI Chatbot project
      - replacement: 'Harbor-Server'
        target_label: machine

      - replacement: 'AI-Chatbot'
        target_label: project

      - replacement: 'Docker'
        target_label: environment

      # Extract service name from compose service label (more reliable)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service_type

      # Override service_type for specific containers using container name
      - source_labels: ['__meta_docker_container_name']
        regex: '.*(worker-approved-docs).*'
        replacement: 'worker-approved-docs'
        target_label: service_type

      - source_labels: ['__meta_docker_container_name']
        regex: '.*(worker-upload-questions).*'
        replacement: 'worker-upload-questions'
        target_label: service_type

      - source_labels: ['__meta_docker_container_name']
        regex: '.*-app-.*'
        replacement: 'app'
        target_label: service_type

      - source_labels: ['__meta_docker_container_name']
        regex: '.*-postgres-.*'
        replacement: 'postgres'
        target_label: service_type

      - source_labels: ['__meta_docker_container_name']
        regex: '.*prompt-faq-ui.*'
        replacement: 'prompt-faq-ui'
        target_label: service_type

    pipeline_stages:
      - docker: {}
