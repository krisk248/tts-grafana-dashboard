server:
  http_listen_port: 9081
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape open-ai containers
  - job_name: ai-chatbot-openai
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["open-ai-*"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - replacement: 'AI-Chatbot'
        target_label: project
      - replacement: 'Harbor-Server'
        target_label: machine
      - replacement: 'Docker'
        target_label: environment
      # Use compose service label for service_type (most reliable)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service_type
    pipeline_stages:
      - docker: {}

  # Scrape prompt-faq-ui container
  - job_name: ai-chatbot-ui
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["prompt-faq-ui"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - replacement: 'AI-Chatbot'
        target_label: project
      - replacement: 'Harbor-Server'
        target_label: machine
      - replacement: 'Docker'
        target_label: environment
      - replacement: 'prompt-faq-ui'
        target_label: service_type
    pipeline_stages:
      - docker: {}

  # ===== ADX_SSP_NODE_2 (Harbor host files, mounted at /var/log/adx-ssp) =====
  - job_name: uae-adx-ssp-node2-ssp-processor
    static_configs:
      - targets:
          - localhost
        labels:
          environment: QA
          region: UAE
          machine: Harbor-Server
          project: ADX_SSP_NODE_2
          app: ADX_SSP_NODE_2
          service_type: ssp-processor
          system: Linux
          __path__: /var/log/adx-ssp/ssp-processor.log
